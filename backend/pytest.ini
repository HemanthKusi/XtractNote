# Pytest configuration for the backend suite.
#
# `pythonpath = .` puts this directory on sys.path so a test can `import app.*`
# exactly as the running server does. It is not optional: with the default
# import mode pytest inserts only the test file's own directory, so every
# `import app.something` would fail with ModuleNotFoundError.
#
# Keeping it here rather than depending on how pytest is invoked means a bare
# `pytest` and `python -m pytest` behave identically, locally and in CI. The
# path is resolved against this file's directory, so the working directory the
# command is run from does not change the outcome.

[pytest]
pythonpath = .
testpaths = tests
